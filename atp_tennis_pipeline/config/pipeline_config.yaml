# ATP Tennis Pipeline Configuration
# ----------------------------------
# Data comes from Jeff Sackmann's open tennis dataset on GitHub.
# Raw GitHub URLs act just like an API — we send an HTTP request and get data back.

pipeline:
  name: "atp_tennis_stats"
  log_level: "INFO"

# URLs for the raw CSV files on GitHub
sources:
  base_url: "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master"
  players: "/atp_players.csv"
  rankings: "/atp_rankings_current.csv"
  matches:
    - "/atp_matches_2024.csv"
    - "/atp_matches_2025.csv"

output:
  rankings_file: "data/output/atp_rankings.parquet"
  player_stats_file: "data/output/atp_player_stats.parquet"
  summary_file: "data/output/atp_summary.csv"
